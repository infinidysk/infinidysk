# One-shot: retag :lts images only (git tag already moved manually).
# Delete this workflow after a successful run.
name: Retag LTS images once

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to retag as lts (e.g. 0.10.0)
        required: true
        default: "0.10.0"

jobs:
  retag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve version
        id: resolve
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${RAW_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '${RAW_VERSION}'"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.5.2
        with:
          username: infinidysk
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Retag Docker image as lts
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          SOURCE="ghcr.io/${{ github.repository }}:v${VERSION}"
          GHCR_TARGET="ghcr.io/${{ github.repository }}:lts"
          DOCKERHUB_TARGET="docker.io/infinidysk/infinidysk:lts"
          docker buildx imagetools create \
            --tag "$GHCR_TARGET" \
            --tag "$DOCKERHUB_TARGET" \
            "$SOURCE"
          echo "Retagged ${SOURCE} -> ${GHCR_TARGET}, ${DOCKERHUB_TARGET}"
