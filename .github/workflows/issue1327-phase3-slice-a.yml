name: Issue 1327 Phase 3 Slice A

on:
  push:
    branches:
      - feat/1327-authoritative-playback
    paths:
      - scripts/issue1327_phase3_slice_a.py
      - .github/workflows/issue1327-phase3-slice-a.yml

permissions:
  contents: write

jobs:
  apply-build-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply source patch
        run: python3 scripts/issue1327_phase3_slice_a.py

      - name: Build backend
        run: dotnet build backend/NzbWebDAV.csproj -c Release

      - name: Run focused backend tests
        run: >-
          dotnet test tests/NzbWebDAV.Tests/NzbWebDAV.Tests.csproj -c Release --no-build
          --filter "FullyQualifiedName~MediaServerConfigTests|FullyQualifiedName~PlaybackSessionRegistryTests|FullyQualifiedName~MediaPlaybackSessionSourceTests|FullyQualifiedName~ActiveReadDavItemIdentityTests"

      - name: Run architecture tests
        run: dotnet test tests/NzbWebDAV.ArchitectureTests/NzbWebDAV.ArchitectureTests.csproj -c Release

      - name: Remove temporary staging files
        run: |
          rm scripts/issue1327_phase3_slice_a.py
          rm .github/workflows/issue1327-phase3-slice-a.yml

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(playback): add authoritative session foundation"
          git push origin HEAD:feat/1327-authoritative-playback
