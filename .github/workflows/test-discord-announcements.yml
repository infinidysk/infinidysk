name: Test Discord Announcements

on:
  workflow_dispatch:
    inputs:
      message:
        description: Message to post to the announcements Discord channel (ignored when summarize is true)
        required: false
        type: string
      summarize:
        description: Summarize conventional-commit notes with the LLM and post to the announcements channel
        required: false
        type: boolean
        default: false
      commits:
        description: Raw conventional-commit first lines to summarize (used when summarize is true)
        required: false
        type: string

permissions:
  contents: read

jobs:
  test-announcements-webhook:
    if: ${{ !inputs.summarize }}
    runs-on: ubuntu-latest
    steps:
      - name: Post test message to Discord announcements
        env:
          DISCORD_ANNOUNCEMENTS_WEBHOOK_URL: ${{ secrets.DISCORD_ANNOUNCEMENTS_WEBHOOK_URL }}
          MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_ANNOUNCEMENTS_WEBHOOK_URL}" ]; then
            echo "DISCORD_ANNOUNCEMENTS_WEBHOOK_URL secret is not set" >&2
            exit 1
          fi
          if [ -z "${MESSAGE}" ]; then
            echo "message input is empty" >&2
            exit 1
          fi

          ESCAPED_BODY=$(printf '%s' "$MESSAGE" | jq -Rsa .)
          curl --fail-with-body -sS -H "Content-Type: application/json" \
            -d "{\"content\": ${ESCAPED_BODY}, \"flags\": 4}" \
            "$DISCORD_ANNOUNCEMENTS_WEBHOOK_URL"

  test-summary-webhook:
    if: ${{ inputs.summarize }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Summarize commits and post to announcements Discord
        env:
          DISCORD_ANNOUNCEMENTS_WEBHOOK_URL: ${{ secrets.DISCORD_ANNOUNCEMENTS_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          COMMITS: ${{ inputs.commits }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_ANNOUNCEMENTS_WEBHOOK_URL}" ]; then
            echo "DISCORD_ANNOUNCEMENTS_WEBHOOK_URL secret is not set" >&2
            exit 1
          fi
          if [ -z "${COMMITS}" ]; then
            echo "commits input is empty" >&2
            exit 1
          fi

          SUMMARY=$(printf '%s' "$COMMITS" | bash .github/scripts/summarize-release-notes.sh --type dev --version test || true)
          if [ -n "$SUMMARY" ]; then
            ANNOUNCEMENT_BODY=$(printf '🧪 **Summary test**\n\n%s' "${SUMMARY}")
          else
            ANNOUNCEMENT_BODY=$(printf '🧪 **Summary test** (summarizer unavailable, posting raw input)\n\n%s' "${COMMITS}")
          fi

          MAX_LEN=1900
          if [ "${#ANNOUNCEMENT_BODY}" -gt "${MAX_LEN}" ]; then
            ANNOUNCEMENT_BODY="${ANNOUNCEMENT_BODY:0:$((MAX_LEN - 3))}..."
          fi

          ESCAPED_BODY=$(printf '%s' "$ANNOUNCEMENT_BODY" | jq -Rsa .)
          curl --fail-with-body -sS -H "Content-Type: application/json" \
            -d "{\"content\": ${ESCAPED_BODY}, \"flags\": 4, \"allowed_mentions\": {\"parse\": []}}" \
            "$DISCORD_ANNOUNCEMENTS_WEBHOOK_URL"
