name: Build dev release assets

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Build production frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run build:server
          npm prune --omit=dev

      - name: Stage frontend
        run: |
          set -euo pipefail
          mkdir frontend-package
          cp frontend/package.json frontend-package/
          cp -a frontend/build frontend/dist-node frontend/node_modules frontend-package/
          tar -czf frontend-package.tar.gz -C frontend-package .

      - name: Upload frontend build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: release-frontend
          path: frontend-package.tar.gz
          if-no-files-found: error
          retention-days: 1

  package:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      # Required to upload archives to the rolling dev release.
      contents: write
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.0.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-dev-release-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props', 'nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-dev-release-nuget-

      - name: Download compiled C# libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: release-csharp-libraries
          path: release-csharp-libraries

      - name: Extract compiled C# libraries
        run: tar -xzf release-csharp-libraries/release-csharp-libraries.tar.gz

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Build rapidyenc
        run: scripts/build-rapidyenc.sh "${{ matrix.rid }}"

      - name: Restore backend
        env:
          RID: ${{ matrix.rid }}
        run: dotnet restore backend/NzbWebDAV.csproj -r "$RID"

      - name: Publish backend
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          for assembly in SharpCompress UsenetSharp RapidYencSharp; do
            assembly_path="$(
              dotnet msbuild "libs/$assembly/$assembly.csproj" \
                -getProperty:TargetPath \
                -p:Configuration=Release
            )"
            if [[ ! -f "$assembly_path" ]]; then
              echo "Cached library output is incomplete: $assembly_path is missing." >&2
              exit 1
            fi
          done

          dotnet publish backend/NzbWebDAV.csproj \
            -c Release \
            -r "$RID" \
            --self-contained false \
            --no-restore \
            -o backend-publish \
            -p:BuildProjectReferences=false \
            -p:RunAnalyzers=false \
            -p:EnforceCodeStyleInBuild=false
          cp "libs/RapidYencSharp/runtimes/$RID/native/librapidyenc.so" backend-publish/

      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: release-frontend
          path: release-frontend

      - name: Assemble archives
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          archive_name="infinidysk-dev-${RID}"
          mkdir -p "$archive_name/backend" "$archive_name/frontend"
          cp -a backend-publish/. "$archive_name/backend/"
          tar -xzf release-frontend/frontend-package.tar.gz -C "$archive_name/frontend"
          install -m 0755 scripts/package/run.sh "$archive_name/run.sh"
          cp scripts/package/README.md "$archive_name/README.md"
          printf 'dev\n' > "$archive_name/version.txt"

          "./$archive_name/backend/NzbWebDAV" --yenc-self-test
          tar -czf "${archive_name}.tar.gz" "$archive_name"

          compat_name="nzbdav-dev-${RID}"
          cp -a "$archive_name" "$compat_name"
          tar -czf "${compat_name}.tar.gz" "$compat_name"

      - name: Attach archives to rolling dev release
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ matrix.rid }}
        run: |
          gh release upload dev \
            "infinidysk-dev-${RID}.tar.gz" \
            "nzbdav-dev-${RID}.tar.gz" \
            --clobber
