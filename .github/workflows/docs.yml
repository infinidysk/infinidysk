name: Documentation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: docs-requirements.txt

      - name: Install documentation dependencies
        run: pip install -r docs-requirements.txt

      - name: Exclude agent-only reference docs
        run: rm -rf docs/reference

      - name: Build documentation
        run: zensical build --clean --strict

      - name: Upload site artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site
          if-no-files-found: error

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-docs
      url: https://www.infinidysk.com/
    steps:
      - name: Checkout Wrangler config
        uses: actions/checkout@v7
        with:
          sparse-checkout: wrangler.jsonc
          sparse-checkout-cone-mode: false

      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: site

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
