name: Cut pre-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Next intended stable (defaults to the open release-please PR version)
        required: false
      ref:
        description: Git ref/SHA to cut from (defaults to the triggering branch tip)
        required: false

concurrency:
  group: cut-prerelease-${{ github.repository }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.vars.outputs.version }}
      rc: ${{ steps.vars.outputs.rc }}
      tag: ${{ steps.vars.outputs.tag }}
      sha: ${{ steps.vars.outputs.sha }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - id: vars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW_VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          VERSION="${RAW_VERSION#v}"
          if [[ -z "$VERSION" ]]; then
            RELEASE_PRS=$(gh pr list \
              --repo "${{ github.repository }}" \
              --state open \
              --head release-please--branches--main \
              --limit 2 \
              --json title)
            RELEASE_PR_COUNT=$(jq length <<< "$RELEASE_PRS")
            if [[ "$RELEASE_PR_COUNT" -ne 1 ]]; then
              echo "Expected exactly one open release-please PR, found $RELEASE_PR_COUNT. Pass version explicitly to override." >&2
              exit 1
            fi
            RELEASE_PR_TITLE=$(jq -r '.[0].title' <<< "$RELEASE_PRS")
            if [[ ! "$RELEASE_PR_TITLE" =~ ^chore\(main\):[[:space:]]release[[:space:]]([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "Could not parse a version from release-please PR title: $RELEASE_PR_TITLE" >&2
              exit 1
            fi
            VERSION="${BASH_REMATCH[1]}"
            echo "Resolved pending version $VERSION from release-please PR."
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version"; exit 1; }
          if gh api "repos/${{ github.repository }}/git/ref/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} is already released" >&2; exit 1
          fi
          SHA=$(gh api "repos/${{ github.repository }}/commits/${REF}" --jq .sha)
          LAST_RC=$(gh api "repos/${{ github.repository }}/git/matching-refs/tags/v${VERSION}-rc." \
            --jq '[.[].ref | split("-rc.")[-1] | tonumber] | max // 0')
          RC=$((LAST_RC + 1))
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "rc=${RC}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-rc.${RC}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    uses: ./.github/workflows/docker-build-push.yml
    permissions:
      contents: read
      packages: write
    with:
      tags: |
        ghcr.io/${{ github.repository }}:${{ needs.resolve.outputs.tag }}
        ghcr.io/${{ github.repository }}:rc
        docker.io/infinidysk/infinidysk:${{ needs.resolve.outputs.tag }}
        docker.io/infinidysk/infinidysk:rc
      legacy_tags: |
        ghcr.io/nzbdav/nzbdav:${{ needs.resolve.outputs.tag }}
      nzbdav_version: ${{ needs.resolve.outputs.version }}-rc.${{ needs.resolve.outputs.rc }}
      checkout_ref: ${{ needs.resolve.outputs.sha }}
      dockerhub_username: infinidysk
    secrets:
      registry_token: ${{ secrets.GITHUB_TOKEN }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
      old_ghcr_token: ${{ secrets.OLD_GHCR_TOKEN }}

  build-dev:
    needs: resolve
    uses: ./.github/workflows/docker-build-push.yml
    permissions:
      contents: read
      packages: write
    with:
      tags: |
        ghcr.io/${{ github.repository }}:dev
        docker.io/infinidysk/infinidysk:dev
      nzbdav_version: dev-${{ needs.resolve.outputs.short_sha }}
      checkout_ref: ${{ needs.resolve.outputs.sha }}
      dockerhub_username: infinidysk
    secrets:
      registry_token: ${{ secrets.GITHUB_TOKEN }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  publish-release:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish unique and rolling pre-releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --target "$RELEASE_SHA" \
            --title "$RELEASE_TAG" \
            --prerelease --generate-notes

          ROLLING_TITLE="Rolling :rc ($RELEASE_TAG)"
          ROLLING_NOTES="Currently points to [$RELEASE_TAG](https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG). See that release for versioned notes and assets."
          if gh release view rc --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit rc \
              --repo "${{ github.repository }}" \
              --target "$RELEASE_SHA" \
              --title "$ROLLING_TITLE" \
              --notes "$ROLLING_NOTES" \
              --prerelease
          else
            gh release create rc \
              --repo "${{ github.repository }}" \
              --target "$RELEASE_SHA" \
              --title "$ROLLING_TITLE" \
              --notes "$ROLLING_NOTES" \
              --prerelease
          fi

          DEV_TITLE="Rolling :dev (dev-${SHORT_SHA})"
          DEV_NOTES="Unversioned development snapshot from \`main\` at [\`${SHORT_SHA}\`](https://github.com/${{ github.repository }}/commit/${RELEASE_SHA}). Currently identical to release candidate [$RELEASE_TAG](https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG)."
          if gh release view dev --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit dev \
              --repo "${{ github.repository }}" \
              --target "$RELEASE_SHA" \
              --title "$DEV_TITLE" \
              --notes "$DEV_NOTES" \
              --prerelease
          else
            gh release create dev \
              --repo "${{ github.repository }}" \
              --target "$RELEASE_SHA" \
              --title "$DEV_TITLE" \
              --notes "$DEV_NOTES" \
              --prerelease
          fi

  assets:
    needs: [resolve, publish-release, tag-rc]
    uses: ./.github/workflows/build-release-assets.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.resolve.outputs.version }}-rc.${{ needs.resolve.outputs.rc }}
      checkout_ref: ${{ needs.resolve.outputs.sha }}
      release_tag: ${{ needs.resolve.outputs.tag }}
      rolling_tag: "rc dev"

  tag-rc:
    needs: [resolve, build, publish-release, tag-dev]
    uses: ./.github/workflows/move-movable-tag.yml
    permissions:
      contents: write
    with:
      tag_name: rc
      ref: ${{ needs.resolve.outputs.sha }}

  tag-dev:
    needs: [resolve, build-dev, publish-release]
    uses: ./.github/workflows/move-movable-tag.yml
    permissions:
      contents: write
    with:
      tag_name: dev
      ref: ${{ needs.resolve.outputs.sha }}

  announce-rc:
    needs:
      - resolve
      - assets
      - tag-rc
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Post release candidate to Discord
        env:
          DISCORD_DEVELOPMENT_WEBHOOK_URL: ${{ secrets.DISCORD_DEVELOPMENT_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
          PREVIOUS_SHA: ${{ needs.tag-rc.outputs.previous_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_DEVELOPMENT_WEBHOOK_URL}" ]; then
            echo "DISCORD_DEVELOPMENT_WEBHOOK_URL secret is not set" >&2
            exit 1
          fi

          BASE_LABEL="Changes since last release candidate"
          if [ -n "${PREVIOUS_SHA}" ] && [ "${PREVIOUS_SHA}" != "${SHA}" ]; then
            CHANGELOG=$(gh api "repos/${REPO}/compare/${PREVIOUS_SHA}...${SHA}" \
              --jq '.commits[] | "- " + (.commit.message | split("\n")[0] | sub(" \\(#[0-9]+\\)$"; ""))')
          elif [ "${PREVIOUS_SHA}" = "${SHA}" ]; then
            CHANGELOG="- (no new commits since last release candidate)"
          else
            BASE_LABEL="Initial release candidate"
            CHANGELOG="- No previous release candidate to compare"
          fi
          if [ -z "${CHANGELOG}" ]; then
            CHANGELOG="- (no new commits since last release candidate)"
          fi

          ANNOUNCEMENT_BODY=$(printf '🧪 **Release Candidate Available** (`%s`)\nRelease and downloads: https://github.com/%s/releases/tag/%s\n\n%s\n%s' \
            "${RELEASE_TAG}" "${REPO}" "${RELEASE_TAG}" "${BASE_LABEL}" "${CHANGELOG}")

          MAX_LEN=1900
          if [ "${#ANNOUNCEMENT_BODY}" -gt "${MAX_LEN}" ]; then
            ANNOUNCEMENT_BODY="${ANNOUNCEMENT_BODY:0:$((MAX_LEN - 3))}..."
          fi

          ESCAPED_BODY=$(printf '%s' "$ANNOUNCEMENT_BODY" | jq -Rsa .)
          curl --fail-with-body -sS -H "Content-Type: application/json" \
            -d "{\"content\": ${ESCAPED_BODY}, \"flags\": 4, \"allowed_mentions\": {\"parse\": []}}" \
            "$DISCORD_DEVELOPMENT_WEBHOOK_URL"
