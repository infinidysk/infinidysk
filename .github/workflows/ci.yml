name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      # Same production build Docker uses; catches .server import / bundler errors typecheck misses.
      - name: Build
        working-directory: frontend
        run: npm run build && npm run build:server

      # Node ESM requires explicit .js extensions in emitted dist-node imports.
      # Import every helper under dist-node/server/ (not server.js, which listens).
      - name: Smoke-import dist-node server modules
        working-directory: frontend
        run: |
          node --input-type=module <<'EOF'
          import { readdir } from "node:fs/promises";

          const directory = "./dist-node/server";
          for (const file of await readdir(directory)) {
            if (file.endsWith(".js")) {
              await import(`${directory}/${file}`);
            }
          }
          EOF

      # The production launcher (server.ts) requires these exports; a build that
      # falls back to the virtual SSR entry ships a server that crashes on start.
      - name: Assert SSR build exports the custom server
        working-directory: frontend
        env:
          BACKEND_URL: http://localhost:9
        run: node --input-type=module -e "const m = await import('./build/server/index.js'); if (typeof m.app !== 'function' || typeof m.initializeWebsocketServer !== 'function') { console.error('build/server/index.js is missing custom server exports (app, initializeWebsocketServer)'); process.exit(1); }"

      - name: Test frontend with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Verify formatting
        run: |
          dotnet format whitespace --verify-no-changes --folder backend
          dotnet format whitespace --verify-no-changes --folder tests
          dotnet format whitespace --verify-no-changes --folder libs

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore backend
        run: |
          dotnet restore backend/NzbWebDAV.csproj
          dotnet restore tests/NzbWebDAV.Tests/NzbWebDAV.Tests.csproj
          dotnet restore tests/SharpCompress.Tests/SharpCompress.Tests.csproj

      - name: Verify NuGet vulnerability gate fixtures
        run: bash scripts/test-nuget-vulnerability-gate.sh

      - name: Audit NuGet production dependencies
        run: |
          report="$(mktemp)"
          trap 'rm -f "$report"' EXIT
          dotnet list backend/NzbWebDAV.csproj package --vulnerable --include-transitive --format json --output-version 1 > "$report"
          python3 scripts/check-nuget-vulnerabilities.py \
            "$report" \
            --allowlist scripts/nuget-vulnerability-allowlist.json \
            --summary "${GITHUB_STEP_SUMMARY}"

      - name: Build backend
        working-directory: backend
        run: dotnet publish -c Release -o ./publish --no-restore

      - name: Test backend
        run: dotnet test tests/NzbWebDAV.Tests/NzbWebDAV.Tests.csproj -c Release --no-restore --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Test SharpCompress
        run: dotnet test tests/SharpCompress.Tests/SharpCompress.Tests.csproj -c Release --no-restore

      - name: Upload backend coverage
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  alpine-yenc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Publish backend for linux-musl-x64
        run: |
          dotnet publish backend/NzbWebDAV.csproj \
            -c Release \
            -r linux-musl-x64 \
            --self-contained false \
            -o ./publish-musl

      - name: yEnc native self-test on Alpine
        run: |
          docker run --rm \
            -v "$PWD/publish-musl:/app:ro" \
            -w /app \
            mcr.microsoft.com/dotnet/aspnet:10.0-alpine \
            sh -c 'apk add --no-cache libc6-compat >/dev/null && ./NzbWebDAV --yenc-self-test'

  docker-runtime-smoke:
    name: Docker runtime image smoke build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect runtime image changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            Dockerfile \
            .dockerignore \
            entrypoint.sh \
            backend/NzbWebDAV.csproj \
            backend/nuget.config \
            libs/ \
            frontend/package.json \
            frontend/package-lock.json; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.changes.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build Docker runtime image
        if: steps.changes.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          build-args: |
            NZBDAV_VERSION=ci
            NZBDAV_COMMIT_SHA=${{ github.event.pull_request.head.sha }}
            REPO_URL=https://github.com/${{ github.repository }}

      - name: Skip unchanged runtime image
        if: steps.changes.outputs.build != 'true'
        run: echo "No runtime image inputs changed; smoke build skipped."
