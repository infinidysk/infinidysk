name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - { if: "matrix.os == 'macos-latest'", shell: bash, run: 'set -eo pipefail; { git rev-parse HEAD; rustc -Vv; sysctl -n machdep.cpu.brand_string; } >> "$GITHUB_STEP_SUMMARY"; cargo run --release --locked -p infinidysk-yenc --example paired | tee -a "$GITHUB_STEP_SUMMARY"' }

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      INFINIDYSK_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p infinidysk-db -p infinidysk -p infinidysk-import --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  discord-announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/test-post-discord-messages.sh

  release-build:
    strategy:
      fail-fast: false
      matrix:
        # Native glibc builds on the same Ubuntu release as the runtime image.
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci && npm run build
        working-directory: ui
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - { if: "matrix.runner == 'ubuntu-26.04-arm'", run: 'cargo test --locked -p infinidysk-yenc --lib' }
      - { shell: bash, run: 'set -eo pipefail; { git rev-parse HEAD; rustc -Vv; LC_ALL=C lscpu; } >> "$GITHUB_STEP_SUMMARY"; cargo run --release --locked -p infinidysk-yenc --example paired | tee -a "$GITHUB_STEP_SUMMARY"' }
