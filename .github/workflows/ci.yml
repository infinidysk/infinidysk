name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      contracts: ${{ steps.changes.outputs.contracts }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect backend and contract inputs
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            backend=true
            contracts=true
          else
            backend=false
            contracts=false
            changed_files="$RUNNER_TEMP/pr-changed-files"
            git diff --no-renames --name-only -z "${BASE_SHA}...${HEAD_SHA}" > "$changed_files"

            # Only known documentation, release metadata, and frontend paths
            # may bypass the backend lanes. Unknown paths fail closed.
            while IFS= read -r -d '' path; do
              case "$path" in
                frontend/*)
                  contracts=true
                  ;;
                .cursor/*|.github/ISSUE_TEMPLATE/*|docs/*)
                  ;;
                .release-please-config.json|.release-please-manifest.json|AGENTS.md|CHANGELOG.md)
                  ;;
                CONTRIBUTING.md|LICENSE|README.md|docs-requirements.txt|version.txt|zensical.toml)
                  ;;
                *)
                  backend=true
                  contracts=true
                  ;;
              esac
            done < "$changed_files"
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "contracts=$contracts" >> "$GITHUB_OUTPUT"

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Check formatting
        working-directory: frontend
        run: npm run format:check

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      # Same production build Docker uses; catches .server import / bundler errors typecheck misses.
      - name: Build
        working-directory: frontend
        run: npm run build && npm run build:server

      # Sub-path build: the only automated coverage NZBDAV_URL_BASE can get.
      # Asserts the baked bundle carries the prefix in its asset URLs and that
      # the root build above was produced without one.
      - name: Build with NZBDAV_URL_BASE
        working-directory: frontend
        env:
          NZBDAV_URL_BASE: /nzbdav
        run: |
          mv build build-root
          npm run build
          if ! grep -rq '/nzbdav/assets/' build/server; then
            echo "sub-path build did not bake /nzbdav into the bundle"; exit 1
          fi
          if grep -rq '/nzbdav/assets/' build-root/server; then
            echo "root build unexpectedly contains the /nzbdav prefix"; exit 1
          fi
          rm -rf build && mv build-root build

      # Node ESM requires explicit .js extensions in emitted dist-node imports.
      # Import every helper under dist-node/server/ (not server.js, which listens).
      - name: Smoke-import dist-node server modules
        working-directory: frontend
        run: |
          node --input-type=module <<'EOF'
          import { readdir } from "node:fs/promises";

          const directory = "./dist-node/server";
          for (const file of await readdir(directory)) {
            if (file.endsWith(".js")) {
              await import(`${directory}/${file}`);
            }
          }
          EOF

      # The production launcher (server.ts) requires these exports; a build that
      # falls back to the virtual SSR entry ships a server that crashes on start.
      - name: Assert SSR build exports the custom server
        working-directory: frontend
        env:
          BACKEND_URL: http://localhost:9
        run: node --input-type=module -e "const m = await import('./build/server/index.js'); if (typeof m.app !== 'function' || typeof m.initializeWebsocketServer !== 'function' || typeof m.configureRuntime !== 'function') { console.error('build/server/index.js is missing custom server exports (app, initializeWebsocketServer, configureRuntime)'); process.exit(1); }"

      - name: Test frontend with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Enforce coverage floor ratchet
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          extra=()
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            if git cat-file -e "origin/$BASE_REF:frontend/coverage-thresholds.json" 2>/dev/null; then
              git show "origin/$BASE_REF:frontend/coverage-thresholds.json" > /tmp/base-coverage-thresholds.json
              extra+=(--base-thresholds /tmp/base-coverage-thresholds.json)
            fi
          fi
          python3 scripts/check-quality-ratchets.py \
            --thresholds frontend/coverage-thresholds.json \
            --summary frontend/coverage/coverage-summary.json \
            --exceptions quality/ratchet-exceptions.json \
            "${extra[@]}"

      - name: Upload frontend coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/cobertura-coverage.xml
            frontend/coverage/lcov.info
            frontend/coverage/coverage-summary.json
          if-no-files-found: error

  backend-quality:
    name: Backend quality
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Verify native build tools
        run: cmake --version && ninja --version

      - name: Build rapidyenc (linux-x64)
        run: scripts/build-rapidyenc.sh linux-x64

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore .NET solution
        run: dotnet restore NzbWebDAV.sln

      # Every first-party project, including tests and benchmarks, is compiled
      # once under the warnings-as-errors analyzer gate. Parallel runtime/test
      # jobs may then disable analyzers without reducing static-analysis coverage.
      # Deterministic streaming/SAB reports are compared in this job; timing
      # comparisons stay off the PR path (see performance.yml).
      - name: Build solution (warning gate)
        run: >
          dotnet build NzbWebDAV.sln -c Release --no-restore
          -p:SkipRapidYencNativeEnsure=true

      - name: Performance deterministic gate
        run: |
          set -euo pipefail
          mkdir -p /tmp/nzbdav-perf
          dotnet run --project backend.Benchmarks/NzbWebDAV.Benchmarks.csproj -c Release --no-build -- \
            --streaming-report --json /tmp/nzbdav-perf/streaming.json
          dotnet run --project backend.Benchmarks/NzbWebDAV.Benchmarks.csproj -c Release --no-build -- \
            --sab-api-report --json /tmp/nzbdav-perf/sab-api.json
          dotnet run --project backend.Benchmarks/NzbWebDAV.Benchmarks.csproj -c Release --no-build -- \
            --nntp-whole-path-report --set quick --json /tmp/nzbdav-perf/nntp-whole-path.json
          python3 scripts/check-performance-baseline.py \
            --baseline backend.Benchmarks/Baselines/streaming-baseline.json \
            --candidates /tmp/nzbdav-perf/streaming.json \
            --deterministic-only \
            --summary "${GITHUB_STEP_SUMMARY}"
          python3 scripts/check-performance-baseline.py \
            --baseline backend.Benchmarks/Baselines/sab-api-baseline.json \
            --candidates /tmp/nzbdav-perf/sab-api.json \
            --deterministic-only \
            --summary "${GITHUB_STEP_SUMMARY}"
          python3 scripts/check-performance-baseline.py \
            --baseline backend.Benchmarks/Baselines/nntp-whole-path-baseline.json \
            --candidates /tmp/nzbdav-perf/nntp-whole-path.json \
            --deterministic-only \
            --summary "${GITHUB_STEP_SUMMARY}"

      - name: Verify CONFIG_PATH preflight fixtures
        run: sh scripts/test-entrypoint-config-preflight.sh

      - name: Verify NuGet vulnerability gate fixtures
        run: bash scripts/test-nuget-vulnerability-gate.sh

      - name: Verify performance baseline gate fixtures
        run: bash scripts/test-performance-baseline-gate.sh

      - name: Verify admin OpenAPI compatibility fixtures
        run: bash scripts/test-admin-openapi-compat.sh

      - name: Check admin OpenAPI compatibility
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if git cat-file -e "origin/${{ github.base_ref }}:contracts/openapi/admin-v1.json" 2>/dev/null; then
            git show "origin/${{ github.base_ref }}:contracts/openapi/admin-v1.json" > /tmp/base-admin-openapi.json
            python3 scripts/check-admin-openapi-compat.py \
              --current contracts/openapi/admin-v1.json \
              --base /tmp/base-admin-openapi.json
          else
            python3 scripts/check-admin-openapi-compat.py \
              --current contracts/openapi/admin-v1.json
          fi

      - name: Audit NuGet production dependencies
        run: |
          report="$(mktemp)"
          trap 'rm -f "$report"' EXIT
          dotnet list backend/NzbWebDAV.csproj package --vulnerable --include-transitive --format json --output-version 1 > "$report"
          python3 scripts/check-nuget-vulnerabilities.py \
            "$report" \
            --allowlist scripts/nuget-vulnerability-allowlist.json \
            --summary "${GITHUB_STEP_SUMMARY}"

      - name: Publish backend
        run: >
          dotnet publish backend/NzbWebDAV.csproj -c Release -o backend/publish
          --no-build --no-restore

      - name: Upload admin OpenAPI contract
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: admin-openapi-v1
          path: contracts/openapi/admin-v1.json
          if-no-files-found: error

  backend-tests:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Verify native build tools
        run: cmake --version && ninja --version

      - name: Build rapidyenc (linux-x64)
        run: scripts/build-rapidyenc.sh linux-x64

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.0.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore .NET solution
        run: dotnet restore NzbWebDAV.sln

      - name: Build backend test projects
        run: |
          dotnet build tests/NzbWebDAV.Tests/NzbWebDAV.Tests.csproj -c Release --no-restore \
            -p:RunAnalyzers=false \
            -p:EnforceCodeStyleInBuild=false \
            -p:SkipRapidYencNativeEnsure=true
          dotnet build tests/NzbWebDAV.ArchitectureTests/NzbWebDAV.ArchitectureTests.csproj -c Release --no-restore \
            -p:RunAnalyzers=false \
            -p:EnforceCodeStyleInBuild=false \
            -p:SkipRapidYencNativeEnsure=true

      - name: Test backend
        env:
          RAPIDYENC_LIBRARY_PATH: ${{ github.workspace }}/libs/RapidYencSharp/runtimes/linux-x64/native/librapidyenc.so
        run: >
          dotnet test tests/NzbWebDAV.Tests/NzbWebDAV.Tests.csproj -c Release
          --no-build --no-restore
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --blame-hang-timeout 2m
          --blame-hang-dump-type none

      - name: Test architecture boundaries
        run: >
          dotnet test tests/NzbWebDAV.ArchitectureTests/NzbWebDAV.ArchitectureTests.csproj
          -c Release --no-build --no-restore

      - name: Collect backend coverage
        run: |
          mkdir -p coverage
          report="$(find TestResults -name coverage.cobertura.xml | head -n 1)"
          if [ -z "$report" ]; then
            echo "error: backend tests produced no Cobertura report" >&2
            exit 1
          fi
          cp "$report" coverage/coverage.cobertura.xml

      - name: Upload backend coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: coverage/coverage.cobertura.xml
          if-no-files-found: error

  library-tests-linux:
    name: Linux library tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Verify native build tools
        run: cmake --version && ninja --version

      - name: Build rapidyenc (linux-x64)
        run: scripts/build-rapidyenc.sh linux-x64

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.0.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore .NET solution
        run: dotnet restore NzbWebDAV.sln

      - name: Build library test projects
        run: |
          dotnet build tests/SharpCompress.Tests/SharpCompress.Tests.csproj -c Release --no-restore \
            -p:RunAnalyzers=false \
            -p:EnforceCodeStyleInBuild=false
          dotnet build tests/RapidYencSharp.Tests/RapidYencSharp.Tests.csproj -c Release --no-restore \
            -p:RunAnalyzers=false \
            -p:EnforceCodeStyleInBuild=false \
            -p:SkipRapidYencNativeEnsure=true
          dotnet build tests/UsenetSharp.Tests/UsenetSharp.Tests.csproj -c Release --no-restore \
            -p:RunAnalyzers=false \
            -p:EnforceCodeStyleInBuild=false \
            -p:SkipRapidYencNativeEnsure=true

      - name: Test SharpCompress
        timeout-minutes: 10
        run: >
          dotnet test tests/SharpCompress.Tests/SharpCompress.Tests.csproj -c Release
          --no-build --no-restore
          --blame-hang-timeout 120s
          --filter "format!=stress"

      - name: Test RapidYencSharp
        env:
          RAPIDYENC_LIBRARY_PATH: ${{ github.workspace }}/libs/RapidYencSharp/runtimes/linux-x64/native/librapidyenc.so
        run: >
          dotnet test tests/RapidYencSharp.Tests/RapidYencSharp.Tests.csproj -c Release
          --no-build --no-restore

      - name: Test UsenetSharp (deterministic)
        env:
          RAPIDYENC_LIBRARY_PATH: ${{ github.workspace }}/libs/RapidYencSharp/runtimes/linux-x64/native/librapidyenc.so
        run: >
          dotnet test tests/UsenetSharp.Tests/UsenetSharp.Tests.csproj -c Release
          --no-build --no-restore
          --filter "TestCategory!=Integration"

  backend-format:
    name: Backend formatting
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Verify formatting
        run: >
          dotnet format whitespace . --folder --verify-no-changes
          --include
          backend
          backend.Benchmarks
          tests/NzbWebDAV.Tests
          tests/UsenetSharp.Tests
          tests/RapidYencSharp.Tests
          libs/UsenetSharp
          libs/RapidYencSharp

  postgres-migrations:
    name: PostgreSQL migration tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nzbdav
          POSTGRES_PASSWORD: nzbdav
          POSTGRES_USER: nzbdav
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nzbdav -d nzbdav"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore PostgreSQL migration tests
        run: dotnet restore tests/NzbWebDAV.Tests/NzbWebDAV.Tests.csproj

      - name: Build PostgreSQL migration tests
        run: >
          dotnet build tests/NzbWebDAV.Tests/NzbWebDAV.Tests.csproj -c Release --no-restore
          -p:RunAnalyzers=false
          -p:EnforceCodeStyleInBuild=false
          -p:SkipRapidYencNativeEnsure=true

      - name: Test PostgreSQL migrations
        env:
          DATABASE_PROVIDER: postgres
          DATABASE_CONNECTION_STRING: Host=localhost;Port=5432;Database=nzbdav;Username=nzbdav;Password=nzbdav
        run: >
          dotnet test tests/NzbWebDAV.Tests/NzbWebDAV.Tests.csproj -c Release
          --no-build --no-restore
          --filter "FullyQualifiedName~PostgresMigrationTests"

  contracts:
    name: HTTP contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend production server
        working-directory: frontend
        run: npm run build && npm run build:server

      - name: Restore contract tests
        run: dotnet restore tests/NzbWebDAV.Tests/NzbWebDAV.Tests.csproj

      - name: Build contract tests
        run: >
          dotnet build tests/NzbWebDAV.Tests/NzbWebDAV.Tests.csproj -c Release --no-restore
          -p:RunAnalyzers=false
          -p:EnforceCodeStyleInBuild=false
          -p:SkipRapidYencNativeEnsure=true

      - name: Run SAB, admin, and WebDAV contract tests
        run: >
          dotnet test tests/NzbWebDAV.Tests/NzbWebDAV.Tests.csproj -c Release
          --no-build --no-restore
          --filter "FullyQualifiedName~SabHttpContractTests|FullyQualifiedName~AdminContractTests|FullyQualifiedName~WebDavContractTests"
          --logger "trx;LogFileName=http-contracts.trx"
          --results-directory ./ContractResults

      - name: Run cross-stack frontend proxy contracts
        run: >
          dotnet test tests/NzbWebDAV.Tests/NzbWebDAV.Tests.csproj -c Release
          --no-build --no-restore
          --filter "Category=CrossStack"
          --logger "trx;LogFileName=cross-stack.trx"
          --results-directory ./ContractResults

      - name: Upload contract failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: contract-diagnostics
          path: ContractResults/*.trx
          if-no-files-found: ignore

  macos-yenc:
    name: macOS yEnc / library tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install native build tools
        run: brew install cmake ninja

      - name: Build rapidyenc (osx-arm64)
        run: scripts/build-rapidyenc.sh osx-arm64

      - name: Restore library tests
        run: |
          dotnet restore tests/RapidYencSharp.Tests/RapidYencSharp.Tests.csproj
          dotnet restore tests/UsenetSharp.Tests/UsenetSharp.Tests.csproj

      - name: Test RapidYencSharp
        env:
          RAPIDYENC_LIBRARY_PATH: ${{ github.workspace }}/libs/RapidYencSharp/runtimes/osx-arm64/native/librapidyenc.dylib
        run: dotnet test tests/RapidYencSharp.Tests/RapidYencSharp.Tests.csproj -c Release

      - name: Test UsenetSharp (deterministic)
        env:
          RAPIDYENC_LIBRARY_PATH: ${{ github.workspace }}/libs/RapidYencSharp/runtimes/osx-arm64/native/librapidyenc.dylib
        run: >
          dotnet test tests/UsenetSharp.Tests/UsenetSharp.Tests.csproj -c Release
          --filter "TestCategory!=Integration"

  alpine-yenc:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build rapidyenc musl-x64 native
        run: |
          docker run --rm \
            -v "$PWD/libs/rapidyenc:/src:ro" \
            -v "$PWD/libs/RapidYencSharp/runtimes:/out" \
            alpine:3.21 \
            sh -c '
              apk add --no-cache build-base cmake ninja >/dev/null
              cmake -S /src -B /tmp/build -G Ninja -DCMAKE_BUILD_TYPE=Release
              cmake --build /tmp/build --config Release --target rapidyenc_shared
              mkdir -p /out/linux-musl-x64/native
              lib_path="$(find /tmp/build -name librapidyenc.so -type f | head -n 1)"
              test -n "$lib_path"
              cp "$lib_path" /out/linux-musl-x64/native/librapidyenc.so
            '

      - name: Restore backend for linux-musl-x64
        run: dotnet restore backend/NzbWebDAV.csproj -r linux-musl-x64

      - name: Publish backend for linux-musl-x64
        run: |
          dotnet publish backend/NzbWebDAV.csproj \
            -c Release \
            -r linux-musl-x64 \
            --self-contained false \
            --no-restore \
            -o ./publish-musl \
            -p:RunAnalyzers=false \
            -p:EnforceCodeStyleInBuild=false \
            -p:SkipRapidYencNativeEnsure=true
          cp libs/RapidYencSharp/runtimes/linux-musl-x64/native/librapidyenc.so ./publish-musl/

      - name: yEnc native self-test on Alpine
        run: |
          docker run --rm \
            -v "$PWD/publish-musl:/app:ro" \
            -w /app \
            mcr.microsoft.com/dotnet/aspnet:10.0-alpine \
            sh -c 'apk add --no-cache libc6-compat >/dev/null && ./NzbWebDAV --yenc-self-test'

  docker-runtime-smoke:
    name: Docker runtime image smoke build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Detect runtime image changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            Dockerfile \
            .dockerignore \
            entrypoint.sh \
            scripts/preflight-config-path.sh \
            backend/NzbWebDAV.csproj \
            nuget.config \
            Directory.Packages.props \
            Directory.Build.props \
            .editorconfig \
            libs/ \
            .gitmodules \
            frontend/package.json \
            frontend/package-lock.json; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.changes.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build Docker runtime image
        if: steps.changes.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          build-args: |
            NZBDAV_VERSION=ci
            NZBDAV_COMMIT_SHA=${{ github.event.pull_request.head.sha }}
            REPO_URL=https://github.com/${{ github.repository }}

      - name: Skip unchanged runtime image
        if: steps.changes.outputs.build != 'true'
        run: echo "No runtime image inputs changed; smoke build skipped."

  quality-ratchets:
    name: Quality ratchets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags --depth=1 origin "$BASE_REF"

      - name: Verify quality ratchet fixtures
        run: bash scripts/test-quality-ratchets.sh

      - name: Enforce ESLint ceiling and coverage-floor ratchets
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          extra=()
          if [ "$EVENT_NAME" = pull_request ]; then
            git show "origin/${BASE_REF}:frontend/package.json" > /tmp/base-package.json
            extra+=(--base-package-json /tmp/base-package.json)
            if git cat-file -e "origin/${BASE_REF}:frontend/coverage-thresholds.json" 2>/dev/null; then
              git show "origin/${BASE_REF}:frontend/coverage-thresholds.json" > /tmp/base-thresholds.json
              extra+=(--base-thresholds /tmp/base-thresholds.json)
            fi
          fi
          python3 scripts/check-quality-ratchets.py \
            --package-json frontend/package.json \
            --thresholds frontend/coverage-thresholds.json \
            --exceptions quality/ratchet-exceptions.json \
            "${extra[@]}"

  quality-gate:
    name: Required quality gate
    if: always()
    needs:
      - changes
      - frontend
      - backend-quality
      - backend-tests
      - library-tests-linux
      - backend-format
      - postgres-migrations
      - macos-yenc
      - alpine-yenc
      - docker-runtime-smoke
      - quality-ratchets
      - contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify required job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            .changes.result == "success" and
            .frontend.result == "success" and
            ."quality-ratchets".result == "success" and
            (
              .changes.outputs.backend != "true" or
              (
                ."backend-quality".result == "success" and
                ."backend-tests".result == "success" and
                ."library-tests-linux".result == "success" and
                ."backend-format".result == "success" and
                ."postgres-migrations".result == "success" and
                ."macos-yenc".result == "success" and
                ."alpine-yenc".result == "success"
              )
            ) and
            (
              .changes.outputs.contracts != "true" or
              .contracts.result == "success"
            ) and
            (."docker-runtime-smoke".result == "success" or ."docker-runtime-smoke".result == "skipped") and
            all(.[]; .result == "success" or .result == "skipped")
          ' <<<"$RESULTS"

  upload-coverage-typescript:
    needs: frontend
    if: ${{ !cancelled() && needs.frontend.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - name: Download frontend coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
      - uses: actions/upload-code-coverage@v1
        with:
          file: cobertura-coverage.xml
          language: TypeScript
          label: code-coverage-agent

  upload-coverage-csharp:
    needs: backend-tests
    if: ${{ !cancelled() && needs.backend-tests.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - name: Download backend coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage
      - uses: actions/upload-code-coverage@v1
        with:
          file: coverage.cobertura.xml
          language: C#
          label: code-coverage-agent
