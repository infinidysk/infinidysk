name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      INFINIDYSK_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p infinidysk-db -p infinidysk -p infinidysk-import --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  discord-announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/test-post-discord-messages.sh

  release-build:
    strategy:
      fail-fast: false
      matrix:
        # Native glibc builds on the same Ubuntu release as the runtime image.
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci && npm run build
        working-directory: ui
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      # The chart renders the same on every architecture, so check it once.
      - uses: azure/setup-helm@v5
        if: matrix.runner == 'ubuntu-26.04'
        with:
          version: v4.3.2
      - uses: actions/setup-python@v7
        if: matrix.runner == 'ubuntu-26.04'
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3
        if: matrix.runner == 'ubuntu-26.04'
      - run: helm lint charts/infinidysk --strict --kube-version 1.31.0
        if: matrix.runner == 'ubuntu-26.04'
      - name: Check chart rendering and application configuration
        if: matrix.runner == 'ubuntu-26.04'
        env:
          HELM_TEST_BINARY: target/release/infinidysk
        run: python .github/scripts/test-helm.py
