name: Refresh :dev

on:
  workflow_dispatch:

concurrency:
  group: refresh-dev-${{ github.repository }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - id: sha
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    uses: ./.github/workflows/docker-build-push.yml
    permissions:
      contents: read
      packages: write
    with:
      tags: |
        ghcr.io/${{ github.repository }}:dev
        docker.io/infinidysk/infinidysk:dev
      nzbdav_version: dev-${{ needs.resolve.outputs.short_sha }}
      dockerhub_username: infinidysk
    secrets:
      registry_token: ${{ secrets.GITHUB_TOKEN }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  publish-release:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create or update rolling dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
        run: |
          set -euo pipefail
          ROLLING_TITLE="Rolling :dev (dev-${SHORT_SHA})"
          ROLLING_NOTES="Unversioned development snapshot from \`main\` at [\`${SHORT_SHA}\`](https://github.com/${{ github.repository }}/commit/${RELEASE_SHA}). Not a release candidate — use for testing only."
          if gh release view dev --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit dev \
              --repo "${{ github.repository }}" \
              --target "$RELEASE_SHA" \
              --title "$ROLLING_TITLE" \
              --notes "$ROLLING_NOTES" \
              --prerelease
          else
            gh release create dev \
              --repo "${{ github.repository }}" \
              --target "$RELEASE_SHA" \
              --title "$ROLLING_TITLE" \
              --notes "$ROLLING_NOTES" \
              --prerelease
          fi

  assets:
    needs: [resolve, publish-release]
    uses: ./.github/workflows/build-release-assets.yml
    permissions:
      contents: write
    with:
      version: dev
      checkout_ref: ${{ github.sha }}
      release_tag: dev
      rolling_tag: dev

  tag-dev:
    needs: [build, publish-release]
    uses: ./.github/workflows/move-movable-tag.yml
    permissions:
      contents: write
    with:
      tag_name: dev
      ref: ${{ github.sha }}

  announce-dev:
    needs:
      - build
      - tag-dev
      - assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Post :dev refresh to Discord
        env:
          DISCORD_ANNOUNCEMENTS_WEBHOOK_URL: ${{ secrets.DISCORD_ANNOUNCEMENTS_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          PREVIOUS_SHA: ${{ needs.tag-dev.outputs.previous_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_ANNOUNCEMENTS_WEBHOOK_URL}" ]; then
            echo "DISCORD_ANNOUNCEMENTS_WEBHOOK_URL secret is not set" >&2
            exit 1
          fi

          SHORT_SHA="${SHA:0:7}"
          BASE_LABEL="Changes since last dev build"
          if [ -n "${PREVIOUS_SHA}" ] && [ "${PREVIOUS_SHA}" != "${SHA}" ]; then
            CHANGELOG=$(gh api "repos/${REPO}/compare/${PREVIOUS_SHA}...${SHA}" \
              --jq '.commits[] | "- " + (.commit.message | split("\n")[0] | sub(" \\(#[0-9]+\\)$"; ""))')
          elif [ "${PREVIOUS_SHA}" = "${SHA}" ]; then
            CHANGELOG="- (no new commits since last dev build)"
          else
            BASE_LABEL="Initial dev build"
            CHANGELOG="- No previous dev build to compare"
          fi
          if [ -z "${CHANGELOG}" ]; then
            CHANGELOG="- (no new commits since last dev build)"
          fi

          SUMMARY=""
          case "$CHANGELOG" in
            *"(no new commits"*|*"No previous"*) ;;
            *)
              SUMMARY=$(printf '%s' "$CHANGELOG" | bash .github/scripts/summarize-release-notes.sh --type dev --version "dev-${SHORT_SHA}" || true)
              ;;
          esac
          if [ -n "${SUMMARY}" ]; then
            ANNOUNCEMENT_BODY=$(printf '🛠️ **Dev Branch Update** (version `dev-%s`)\nRelease and downloads: https://github.com/%s/releases/tag/dev\n\n%s' \
              "${SHORT_SHA}" "${REPO}" "${SUMMARY}")
          else
            ANNOUNCEMENT_BODY=$(printf '🛠️ **Dev Branch Update** (version `dev-%s`)\nRelease and downloads: https://github.com/%s/releases/tag/dev\n\n%s\n%s' \
              "${SHORT_SHA}" "${REPO}" "${BASE_LABEL}" "${CHANGELOG}")
          fi

          MAX_LEN=1900
          if [ "${#ANNOUNCEMENT_BODY}" -gt "${MAX_LEN}" ]; then
            ANNOUNCEMENT_BODY="${ANNOUNCEMENT_BODY:0:$((MAX_LEN - 3))}..."
          fi

          ESCAPED_BODY=$(printf '%s' "$ANNOUNCEMENT_BODY" | jq -Rsa .)
          curl --fail-with-body -sS -H "Content-Type: application/json" \
            -d "{\"content\": ${ESCAPED_BODY}, \"flags\": 4, \"allowed_mentions\": {\"parse\": []}}" \
            "$DISCORD_ANNOUNCEMENTS_WEBHOOK_URL"
