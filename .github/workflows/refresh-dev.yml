name: Refresh :dev

on:
  workflow_dispatch:

concurrency:
  group: refresh-dev-${{ github.repository }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
      dev_label: ${{ steps.sha.outputs.dev_label }}
    steps:
      - id: sha
        run: |
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "dev_label=dev-$(date -u +%y%m%d.%H%M)" >> "$GITHUB_OUTPUT"

  seed-library-cache:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Skip cache seed outside main
        if: github.ref != 'refs/heads/main'
        run: echo "Compiled library caches are written only from main."

      - name: Checkout repository
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Set up .NET
        if: github.ref == 'refs/heads/main'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Resolve .NET SDK version
        if: github.ref == 'refs/heads/main'
        id: dotnet-sdk
        run: echo "version=$(dotnet --version)" >> "$GITHUB_OUTPUT"

      - name: Cache NuGet packages
        if: github.ref == 'refs/heads/main'
        id: nuget-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.0.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-release-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props', 'nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-release-nuget-

      - name: Cache compiled C# libraries
        if: github.ref == 'refs/heads/main'
        id: library-build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.0.0
        with:
          path: |
            libs/SharpCompress/bin
            libs/SharpCompress/obj
            libs/UsenetSharp/bin
            libs/UsenetSharp/obj
            libs/RapidYencSharp/bin
            libs/RapidYencSharp/obj
          key: library-build-v1-${{ runner.os }}-Release-${{ steps.dotnet-sdk.outputs.version }}-${{ hashFiles('Directory.Build.props', 'Directory.Packages.props', '.editorconfig', 'libs/SharpCompress.snk', 'libs/SharpCompress/**/*.cs', 'libs/SharpCompress/*.csproj', 'libs/SharpCompress/.editorconfig', 'libs/UsenetSharp/**/*.cs', 'libs/UsenetSharp/*.csproj', 'libs/UsenetSharp/.editorconfig', 'libs/RapidYencSharp/**/*.cs', 'libs/RapidYencSharp/*.csproj', 'libs/RapidYencSharp/.editorconfig') }}

      - name: Restore C# libraries
        if: github.ref == 'refs/heads/main' && (steps.library-build-cache.outputs.cache-hit != 'true' || steps.nuget-cache.outputs.cache-hit != 'true')
        run: |
          dotnet restore libs/SharpCompress/SharpCompress.csproj
          dotnet restore libs/UsenetSharp/UsenetSharp.csproj

      - name: Build C# libraries
        if: github.ref == 'refs/heads/main' && steps.library-build-cache.outputs.cache-hit != 'true'
        run: |
          dotnet build libs/SharpCompress/SharpCompress.csproj -c Release --no-restore \
            -p:RunAnalyzers=false -p:EnforceCodeStyleInBuild=false
          dotnet build libs/UsenetSharp/UsenetSharp.csproj -c Release --no-restore \
            -p:RunAnalyzers=false -p:EnforceCodeStyleInBuild=false \
            -p:SkipRapidYencNativeEnsure=true

  build:
    needs: resolve
    uses: ./.github/workflows/docker-build-push.yml
    permissions:
      contents: read
      packages: write
    with:
      tags: |
        ghcr.io/${{ github.repository }}:dev
        docker.io/infinidysk/infinidysk:dev
      nzbdav_version: ${{ needs.resolve.outputs.dev_label }}
      dockerhub_username: infinidysk
    secrets:
      registry_token: ${{ secrets.GITHUB_TOKEN }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  publish-release:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create or update rolling dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
          DEV_LABEL: ${{ needs.resolve.outputs.dev_label }}
        run: |
          set -euo pipefail
          ROLLING_TITLE="Rolling :dev (${DEV_LABEL})"
          ROLLING_NOTES="Unversioned development snapshot from \`main\` at [\`${SHORT_SHA}\`](https://github.com/${{ github.repository }}/commit/${RELEASE_SHA}). Not a release candidate — use for testing only."
          if gh release view dev --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit dev \
              --repo "${{ github.repository }}" \
              --target "$RELEASE_SHA" \
              --title "$ROLLING_TITLE" \
              --notes "$ROLLING_NOTES" \
              --prerelease
          else
            gh release create dev \
              --repo "${{ github.repository }}" \
              --target "$RELEASE_SHA" \
              --title "$ROLLING_TITLE" \
              --notes "$ROLLING_NOTES" \
              --prerelease
          fi

  assets:
    needs: [resolve, seed-library-cache, publish-release]
    uses: ./.github/workflows/build-release-assets.yml
    permissions:
      contents: write
    with:
      version: dev
      checkout_ref: ${{ github.sha }}
      release_tag: dev
      rolling_tag: dev

  tag-dev:
    needs: [build, publish-release]
    uses: ./.github/workflows/move-movable-tag.yml
    permissions:
      contents: write
    with:
      tag_name: dev
      ref: ${{ github.sha }}

  announce-dev:
    needs:
      - resolve
      - build
      - tag-dev
      - assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Post :dev refresh to Discord
        env:
          DISCORD_ANNOUNCEMENTS_WEBHOOK_URL: ${{ secrets.DISCORD_ANNOUNCEMENTS_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          PREVIOUS_SHA: ${{ needs.tag-dev.outputs.previous_sha }}
          DEV_LABEL: ${{ needs.resolve.outputs.dev_label }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_ANNOUNCEMENTS_WEBHOOK_URL}" ]; then
            echo "DISCORD_ANNOUNCEMENTS_WEBHOOK_URL secret is not set" >&2
            exit 1
          fi

          BASE_LABEL="Changes since last dev build"
          HAS_COMMITS=false
          if [ -n "${PREVIOUS_SHA}" ] && [ "${PREVIOUS_SHA}" != "${SHA}" ]; then
            CHANGELOG=$(gh api "repos/${REPO}/compare/${PREVIOUS_SHA}...${SHA}" \
              --jq '.commits[] | "- " + (.commit.message | split("\n")[0] | sub(" \\(#[0-9]+\\)$"; ""))')
            if [ -n "${CHANGELOG}" ]; then
              HAS_COMMITS=true
            fi
          elif [ "${PREVIOUS_SHA}" = "${SHA}" ]; then
            CHANGELOG="- (no new commits since last dev build)"
          else
            BASE_LABEL="Initial dev build"
            CHANGELOG="- No previous dev build to compare"
          fi
          if [ -z "${CHANGELOG}" ]; then
            CHANGELOG="- (no new commits since last dev build)"
          fi

          SUMMARY=""
          if [ "${HAS_COMMITS}" = "true" ]; then
            SUMMARY=$(printf '%s' "$CHANGELOG" | bash .github/scripts/summarize-release-notes.sh --type dev --version "${DEV_LABEL}" || true)
          fi
          if [ -n "${SUMMARY}" ]; then
            ANNOUNCEMENT_BODY=$(printf '🛠️ **Dev Branch Update** (version `%s`)\nRelease and downloads: https://github.com/%s/releases/tag/dev\n\n%s' \
              "${DEV_LABEL}" "${REPO}" "${SUMMARY}")
          else
            ANNOUNCEMENT_BODY=$(printf '🛠️ **Dev Branch Update** (version `%s`)\nRelease and downloads: https://github.com/%s/releases/tag/dev\n\n%s\n%s' \
              "${DEV_LABEL}" "${REPO}" "${BASE_LABEL}" "${CHANGELOG}")
          fi

          MAX_LEN=1900
          if [ "${#ANNOUNCEMENT_BODY}" -gt "${MAX_LEN}" ]; then
            ANNOUNCEMENT_BODY="${ANNOUNCEMENT_BODY:0:$((MAX_LEN - 3))}..."
          fi

          ESCAPED_BODY=$(printf '%s' "$ANNOUNCEMENT_BODY" | jq -Rsa .)
          curl --fail-with-body -sS -H "Content-Type: application/json" \
            -d "{\"content\": ${ESCAPED_BODY}, \"flags\": 4, \"allowed_mentions\": {\"parse\": []}}" \
            "$DISCORD_ANNOUNCEMENTS_WEBHOOK_URL"
