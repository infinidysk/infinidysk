name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Serialize runs so an older build never overwrites a newer `edge`.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # Tester image; never tag it `latest` so nobody lands on it by accident.
  IMAGE: ghcr.io/infinidysk/infinidysk-next

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-26.04
            platform: linux/amd64
          - runner: ubuntu-26.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            COMMIT=${{ github.sha }}
            VERSION=${{ needs.release-please.outputs.tag_name }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
      - run: echo "${{ steps.build.outputs.digest }}" > "digest-${{ strategy.job-index }}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ strategy.job-index }}
          path: digest-${{ strategy.job-index }}
          retention-days: 1

  image-manifest:
    needs: [release-please, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          # The server's update check needs every pushed image to carry a new version tag and `sha-<12>`.
          tags=(-t "$IMAGE:edge" -t "$IMAGE:sha-${GITHUB_SHA::12}" -t "$IMAGE:$RELEASE_TAG")
          mapfile -t refs < <(sed "s|^|$IMAGE@|" digest-*)
          # GHCR reads these from the multi-arch index, not from the per-platform labels.
          annotations=(
            --annotation "index:org.opencontainers.image.source=https://github.com/infinidysk/infinidysk"
            --annotation "index:org.opencontainers.image.description=Usenet-backed virtual filesystem with a SABnzbd-compatible API, FUSE and WebDAV"
            --annotation "index:org.opencontainers.image.licenses=MIT"
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA"
            --annotation "index:org.opencontainers.image.version=$RELEASE_TAG"
          )
          docker buildx imagetools create "${annotations[@]}" "${tags[@]}" "${refs[@]}"

  announce:
    needs: [release-please, image-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Post the release to Discord dev-announcements
        env:
          DISCORD_ANNOUNCEMENTS_WEBHOOK_URL: ${{ secrets.DISCORD_DEVANNOUNCEMENTS_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_ANNOUNCEMENTS_WEBHOOK_URL}" ]; then
            echo "DISCORD_DEVANNOUNCEMENTS_WEBHOOK_URL secret is not set" >&2
            exit 1
          fi

          # The release body is the edited release PR notes, not just the generated changelog.
          NOTES=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          SUMMARY=$(printf '%s' "$NOTES" | bash .github/scripts/summarize-release-notes.sh --type dev --version "$RELEASE_TAG" || true)
          if [ -n "$SUMMARY" ]; then
            BODY=$(printf '🛠️ **InfiniDysk 2.x: %s**\nImage: `%s:edge`\n\n%s\n\nRelease notes: %s' \
              "$RELEASE_TAG" "$IMAGE" "$SUMMARY" "$URL")
          else
            BODY=$(printf '🛠️ **InfiniDysk 2.x: %s**\nImage: `%s:edge`\nRelease notes: %s\n\n%s' \
              "$RELEASE_TAG" "$IMAGE" "$URL" "$NOTES")
          fi
          printf '%s' "$BODY" | bash .github/scripts/post-discord-messages.sh
