name: Release

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to publish (e.g. 0.6.5)
        required: true

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
      sha: ${{ steps.release.outputs.sha }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Create release
        uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .release-please-config.json

  resolve-version:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.vars.outputs.version }}
      major: ${{ steps.vars.outputs.major }}
      minor: ${{ steps.vars.outputs.minor }}
      patch: ${{ steps.vars.outputs.patch }}
      ref: ${{ steps.vars.outputs.ref }}
    steps:
      - name: Resolve version and tag
        id: vars
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            REF="v${VERSION}"
          else
            REF="${{ github.event.release.tag_name }}"
            VERSION="${REF#v}"
          fi
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          PATCH="${VERSION##*.}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"
          echo "minor=${MINOR}" >> "$GITHUB_OUTPUT"
          echo "patch=${PATCH}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.event_name == 'push' && needs.release-please.outputs.release_created == 'true'
    needs: release-please
    uses: ./.github/workflows/docker-build-push.yml
    permissions:
      contents: read
      packages: write
    with:
      tags: |
        ghcr.io/${{ github.repository }}:latest
        ghcr.io/${{ github.repository }}:dev
        ghcr.io/${{ github.repository }}:v${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}.${{ needs.release-please.outputs.patch }}
        ghcr.io/${{ github.repository }}:v${{ needs.release-please.outputs.major }}
        ghcr.io/${{ github.repository }}:v${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
        docker.io/infinidysk/infinidysk:latest
        docker.io/infinidysk/infinidysk:dev
        docker.io/infinidysk/infinidysk:v${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}.${{ needs.release-please.outputs.patch }}
        docker.io/infinidysk/infinidysk:v${{ needs.release-please.outputs.major }}
        docker.io/infinidysk/infinidysk:v${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
      nzbdav_version: ${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}.${{ needs.release-please.outputs.patch }}
      checkout_ref: ${{ needs.release-please.outputs.sha }}
      dockerhub_username: infinidysk
    secrets:
      registry_token: ${{ secrets.GITHUB_TOKEN }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  assets:
    if: github.event_name == 'push' && needs.release-please.outputs.release_created == 'true'
    needs: release-please
    uses: ./.github/workflows/build-release-assets.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}.${{ needs.release-please.outputs.patch }}
      checkout_ref: ${{ needs.release-please.outputs.sha }}
      release_tag: v${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}.${{ needs.release-please.outputs.patch }}

  deploy-manual:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: resolve-version
    uses: ./.github/workflows/docker-build-push.yml
    permissions:
      contents: read
      packages: write
    with:
      tags: |
        ghcr.io/${{ github.repository }}:latest
        ghcr.io/${{ github.repository }}:dev
        ghcr.io/${{ github.repository }}:${{ needs.resolve-version.outputs.ref }}
        ghcr.io/${{ github.repository }}:v${{ needs.resolve-version.outputs.major }}
        ghcr.io/${{ github.repository }}:v${{ needs.resolve-version.outputs.major }}.${{ needs.resolve-version.outputs.minor }}
        docker.io/infinidysk/infinidysk:latest
        docker.io/infinidysk/infinidysk:dev
        docker.io/infinidysk/infinidysk:${{ needs.resolve-version.outputs.ref }}
        docker.io/infinidysk/infinidysk:v${{ needs.resolve-version.outputs.major }}
        docker.io/infinidysk/infinidysk:v${{ needs.resolve-version.outputs.major }}.${{ needs.resolve-version.outputs.minor }}
      nzbdav_version: ${{ needs.resolve-version.outputs.version }}
      checkout_ref: ${{ needs.resolve-version.outputs.ref }}
      dockerhub_username: infinidysk
    secrets:
      registry_token: ${{ secrets.GITHUB_TOKEN }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  assets-manual:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: resolve-version
    uses: ./.github/workflows/build-release-assets.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      checkout_ref: ${{ needs.resolve-version.outputs.ref }}
      release_tag: ${{ needs.resolve-version.outputs.ref }}

  tag-dev:
    if: github.event_name == 'push' && needs.release-please.outputs.release_created == 'true'
    needs:
      - release-please
      - deploy
    uses: ./.github/workflows/move-movable-tag.yml
    permissions:
      contents: write
    with:
      tag_name: dev
      ref: ${{ needs.release-please.outputs.sha }}

  tag-dev-manual:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs:
      - resolve-version
      - deploy-manual
    uses: ./.github/workflows/move-movable-tag.yml
    permissions:
      contents: write
    with:
      tag_name: dev
      ref: ${{ needs.resolve-version.outputs.ref }}

  announce:
    if: github.event_name == 'push' && needs.release-please.outputs.release_created == 'true'
    needs:
      - release-please
      - deploy
      - tag-dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Post announcement to Discord
        env:
          DISCORD_ANNOUNCEMENTS_WEBHOOK_URL: ${{ secrets.DISCORD_ANNOUNCEMENTS_WEBHOOK_URL }}
          VERSION: ${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}.${{ needs.release-please.outputs.patch }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_ANNOUNCEMENTS_WEBHOOK_URL}" ]; then
            echo "DISCORD_ANNOUNCEMENTS_WEBHOOK_URL secret is not set" >&2
            exit 1
          fi

          # Single-process extract: a sed|sed pipeline SIGPIPEs under pipefail when the
          # second sed quits at the next ## [version] heading on a large CHANGELOG.
          RELEASE_NOTES=$(awk '
            /^## \[[0-9]+\.[0-9]+\.[0-9]+\]\(/ {
              if (seen++) exit
              next
            }
            seen { print }
          ' CHANGELOG.md)
          RELEASE_NOTES=$(printf '%s\n' "${RELEASE_NOTES}" | sed -E \
            -e 's/ \(\[#[0-9]+\]\(https:\/\/github\.com\/[^)]+\/issues\/[0-9]+\)\)//g' \
            -e 's/ \(\[[0-9a-f]+\]\(https:\/\/github\.com\/[^)]+\/commit\/[^)]+\)\)//g' \
            -e 's/, closes \[#[0-9]+\]\(https:\/\/github\.com\/[^)]+\/issues\/[0-9]+\)//g')

          ANNOUNCEMENT_BODY=$(printf '🚀 **New Release: Version [%s]**%s' "${VERSION}" "${RELEASE_NOTES}")

          # Discord content is limited to 2000 characters.
          MAX_LEN=1900
          if [ "${#ANNOUNCEMENT_BODY}" -gt "${MAX_LEN}" ]; then
            ANNOUNCEMENT_BODY="${ANNOUNCEMENT_BODY:0:$((MAX_LEN - 3))}..."
          fi

          ESCAPED_BODY=$(printf '%s' "$ANNOUNCEMENT_BODY" | jq -Rsa .)
          curl --fail-with-body -sS -H "Content-Type: application/json" \
            -d "{\"content\": ${ESCAPED_BODY}, \"flags\": 4, \"allowed_mentions\": {\"parse\": []}}" \
            "$DISCORD_ANNOUNCEMENTS_WEBHOOK_URL"
