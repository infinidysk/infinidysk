name: Bug report
description: Report a reproducible problem in InfiniDysk
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        Please do not include Usenet credentials, API keys, passwords, NZB contents, or other private data. InfiniDysk supports legally obtained content only; reports involving copyright infringement will be closed.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues and did not find a duplicate.
          required: true
        - label: I am using InfiniDysk with legally obtained content.
          required: true

  - type: dropdown
    id: major-version
    attributes:
      label: Which InfiniDysk?
      description: 2.x is the Rust rewrite on `main`. 1.x is the C# version on the `v1` branch and gets bug fixes only.
      options:
        - 2.x (ghcr.io/infinidysk/infinidysk-next)
        - 1.x (ghcr.io/infinidysk/infinidysk)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: InfiniDysk version
      description: Enter the version shown in the InfiniDysk UI or the Docker image tag.
      placeholder: "e.g. 2.0.0-beta.1 or ghcr.io/infinidysk/infinidysk:1.7.1"
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Official Docker image
        - Dumbarr
        - Built from source
        - Other
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - WebDAV or streaming
        - Usenet provider connection
        - Queue, NZB processing, or health checks
        - SABnzbd-compatible API
        - Sonarr, Radarr, or another integration
        - Admin UI
        - Authentication
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior, including any error message.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable set of steps.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Technical support pack, relevant logs, or screenshots
      description: |
        On 2.x, open the **System** page and download a support pack (or attach `/config/logs/infinidysk.log`).
        For playback problems, include a read trace of the problem. For upgrade problems, include the
        output of `import-report`. See https://www.infinidysk.com/v2/help/reporting/.

        On 1.x, open **Settings → Support** in InfiniDysk and select
        **Generate & download**. Review the downloaded ZIP, then drag it into this field to upload it.
        The pack automatically redacts credentials, API keys, tokens, URL credentials, sensitive URL
        parameters, and IP addresses; it can still contain file names, paths, account usernames, and DNS
        names. Do not attach NZB contents or other private data. You can also paste redacted logs (inside
        ```text fences) or attach screenshots.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, CPU architecture, browser/client, and integration versions when relevant.
      placeholder: |
        OS:
        Architecture:
        Browser or WebDAV client:
        Integration and version:

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add anything else that could help investigate the problem.
