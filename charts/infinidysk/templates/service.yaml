apiVersion: v1
kind: Service
metadata:
  name: {{ include "infinidysk.name" . | quote }}
  labels:
    {{- include "infinidysk.selector" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "infinidysk.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
