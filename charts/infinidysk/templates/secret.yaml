{{- if .Values.secretSettings }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-settings" (include "infinidysk.name" .) | quote }}
  labels:
    {{- include "infinidysk.selector" . | nindent 4 }}
type: Opaque
data:
  {{- range $path, $value := .Values.secretSettings }}
  {{ printf "INFINIDYSK__%s" (upper (replace "." "__" $path)) }}: {{ include "infinidysk.value" $value | b64enc | quote }}
  {{- end }}
{{- end }}
