[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# ponytail: crate versions stay 0.0.0; release-please owns the product version in version.txt.
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/infinidysk/infinidysk"
publish = false

[workspace.dependencies]
aes = "0.9.3"
anyhow = "1"
argon2 = "0.6.0"
axum = { version = "0.8.9", default-features = false }
base64 = "0.23.1"
bytes = "1.12.1"
cmake = "0.1"
crc32fast = "1.5.2"
flate2 = "1.1.10"
fuse3 = { version = "0.10.0", features = ["tokio-runtime", "unprivileged"] }
futures-util = { version = "0.3.34", default-features = false }
hmac = "0.13.0"
http-body-util = "0.1.5"
httpdate = "1.0.3"
idna = "1.1.0"
ipnet = "2.12.2"
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-always"] }
lzma-rs = { version = "0.3.0", default-features = false }
md-5 = "0.11.0"
nix = { version = "0.31.3", default-features = false, features = ["mount", "user"] }
openidconnect = { version = "4.1.0", default-features = false }
percent-encoding = "2.3.2"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
quick-xml = "0.42.0"
quick_cache = { version = "0.7.0", default-features = false }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
rustls = "0.23.45"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
socket2 = "0.6.5"
sqlx = { version = "0.9.0", default-features = false, features = [
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "sqlite-bundled",
    "tls-rustls-aws-lc-rs",
    "uuid",
] }
thiserror = "2"
tokio = "1"
tokio-rustls = "0.26.6"
tokio-util = "0.7.20"
toml = "1"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "std"] }
utoipa = { version = "6.0.0", features = ["uuid"] }
uuid = { version = "1.28.0", features = ["serde", "v4", "v7"] }
webpki-roots = "1.0.9"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
zstd = "0.14.2"

infinidysk = { path = "crates/infinidysk" }
infinidysk-archive = { path = "crates/archive" }
infinidysk-arr = { path = "crates/arr" }
infinidysk-core = { path = "crates/core" }
infinidysk-db = { path = "crates/db" }
infinidysk-fuse = { path = "crates/fuse" }
infinidysk-health = { path = "crates/health" }
infinidysk-import = { path = "crates/import" }
infinidysk-nntp = { path = "crates/nntp" }
infinidysk-par2 = { path = "crates/par2" }
infinidysk-queue = { path = "crates/queue" }
infinidysk-stream = { path = "crates/stream" }
infinidysk-testkit = { path = "crates/testkit" }
infinidysk-vfs = { path = "crates/vfs" }
infinidysk-webdav = { path = "crates/webdav" }
infinidysk-yenc = { path = "crates/yenc" }

[workspace.lints.rust]
# FFI crates opt back in with a crate-level `#![allow(unsafe_code)]`.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
similar_names = "allow"
# Selected nursery lints.
significant_drop_tightening = "warn"
redundant_clone = "warn"
use_self = "warn"
or_fun_call = "warn"
# Restriction lints.
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
# panic stays "unwind": callback panics must be caught without faulting transport tasks.

# Release with line tables for perf/heaptrack; the shipped binary is unchanged.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
