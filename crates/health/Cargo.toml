[package]
name = "infinidysk-health"
description = "Health checks of stored releases and repair through the Arr that imported them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
futures-util = { workspace = true, features = ["alloc", "std"] }
infinidysk-arr.workspace = true
infinidysk-core.workspace = true
infinidysk-db.workspace = true
infinidysk-nntp.workspace = true
infinidysk-par2.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["http1", "json", "query", "tokio"] }
infinidysk-queue.workspace = true
infinidysk-testkit.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
